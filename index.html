    <!-- Cache Busting Headers for Instant iOS PWA Updates -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />

    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
    <link rel="manifest" href="./manifest.json" />

    <title>BubuLink • Zenah & Arnav</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/bubulink-web/assets/index-Btj046RP.js"></script>
    <link rel="stylesheet" crossorigin href="/bubulink-web/assets/index-CDOIrGfB.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Auto-Updating Service Worker Engine
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' })
          .then(function(reg) {
            console.log('[BubuLink] SW registered:', reg.scope);
            // Proactively check for newer versions on every page load
            reg.update();

            reg.addEventListener('updatefound', function() {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[BubuLink] New update installed! Refreshing client...');
                    window.location.reload();
                  }
                });
              }
            });
          })
          .catch(function(err) {
            console.error('[BubuLink] SW registration notice: ', err);
          });

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
